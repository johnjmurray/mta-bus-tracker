<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NYC Bus Tracker</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: sans-serif; }
    #map { height: 600px; width: 100%; margin-top: 10px; }
  </style>
</head>
<body>

<h1>MTA Bus Tracker</h1>

<label for="veh">Vehicle IDs (comma separated):</label>
<input id="veh" placeholder="Example: 7560, 4321, 8884" size="40" />
<button type="button" onclick="track()">Track</button>

<label><input type="checkbox" id="auto" /> Auto-refresh every 20s</label>

<div id="map"></div>

<script src="app.js"></script>

</body>
</html>
