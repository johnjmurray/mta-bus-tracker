<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>MTA Bus Tracker</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="card controls-card">
          <h1>MTA Bus Tracker</h1>
          <p class="subtitle">Live NYC bus tracking for GitHub Pages</p>

          <div class="field">
            <label for="apiKey">GTFS-RT API key</label>
            <input id="apiKey" type="password" placeholder="Enter key" />
          </div>

          <div class="button-row">
            <button id="saveKey" class="primary">Save key</button>
            <button id="clearKey">Clear</button>
          </div>

          <div class="field">
            <label for="mode">Search mode</label>
            <select id="mode">
              <option value="vehicle">Vehicle IDs</option>
              <option value="route">Route ID</option>
            </select>
          </div>

          <div class="field">
            <label id="queryLabel" for="query">Vehicle IDs</label>
            <input id="query" type="text" placeholder="e.g. 7560, 4321 or B41" />
          </div>

          <div class="button-row mobile-row">
            <button id="track" class="primary">Track</button>
            <label class="checkbox-wrap">
              <input id="auto" type="checkbox" />
              <span>Auto-refresh</span>
            </label>
          </div>
        </div>

        <div class="card routes-card">
          <div class="panel-header">
            <h2>Routes</h2>
            <button id="clearRouteFilter" class="small">Clear filter</button>
          </div>
          <div id="routeLegend" class="route-legend"></div>
          <div id="routeList" class="route-list"></div>
        </div>
      </aside>

      <main class="map-container card">
        <div class="map-toolbar">
          <div id="status" class="status-pill">Ready</div>
          <div id="last" class="last-update">Last update: never</div>
        </div>
        <div id="error" class="error" aria-live="assertive"></div>
        <div id="map"></div>
      </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/protobufjs/dist/protobuf.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
